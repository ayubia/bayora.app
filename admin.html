<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PPOBKU — Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f6f2;
            color: #171717;
        }

        header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e8e6e0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
        }

        .admin-label {
            color: #777;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 24px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 2px;
            color: #888;
            font-weight: 700;
        }

        h1 {
            margin: 8px 0 35px;
            font-size: 42px;
            letter-spacing: -1.5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 35px;
        }

        .stat {
            background: white;
            border: 1px solid #e7e4dd;
            border-radius: 18px;
            padding: 24px;
        }

        .stat span {
            color: #888;
            font-size: 13px;
        }

        .stat strong {
            display: block;
            margin-top: 10px;
            font-size: 28px;
        }

        .panel {
            background: white;
            border: 1px solid #e7e4dd;
            border-radius: 20px;
            overflow: hidden;
        }

        .panel-header {
            padding: 22px 24px;
            border-bottom: 1px solid #eee;
            font-weight: 700;
        }

        .transaction-tools {
            display: flex;
            gap: 10px;
            padding: 18px 24px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }

        .transaction-search {
            flex: 1;
            min-width: 220px;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .transaction-filter {
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }

        .refresh-button {
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            background: #171717;
            color: white;
            cursor: pointer;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 17px 20px;
            text-align: left;
            border-bottom: 1px solid #f0eee9;
            white-space: nowrap;
        }

        th {
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }

        td {
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f1eee7;
            font-size: 12px;
            font-weight: 700;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 34px;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<header>

    <div class="logo">
        PPOBKU
    </div>

    <div class="admin-label">
        Admin Dashboard
    </div>

</header>


<main>

    <div class="eyebrow">
        ADMIN
    </div>

    <h1>
        Ringkasan transaksi
    </h1>


    <section class="stats">

        <div class="stat">
            <span>Total transaksi</span>
            <strong id="totalTransactions">0</strong>
        </div>

        <div class="stat">
            <span>Pending</span>
            <strong id="pendingTransactions">0</strong>
        </div>

        <div class="stat">
            <span>Berhasil</span>
            <strong id="successTransactions">0</strong>
        </div>

        <div class="stat">
            <span>Total nominal</span>
            <strong id="totalAmount">Rp0</strong>
        </div>

    </section>


    <section class="panel">

        <div class="panel-header">
            Transaksi terbaru
        </div>

        <div class="transaction-period-tools">

            <div>
                <label for="transactionMonth">
                    Periode transaksi
                </label>

                <select
                    id="transactionMonth"
                    onchange="loadTransactions()"
                ></select>
            </div>

            <button
                type="button"
                class="reset-transactions-button"
                onclick="resetCurrentMonth()"
            >
                Reset Bulan Ini
            </button>

        </div>


        <div class="transaction-tools">

            <input
                type="search"
                id="transactionSearch"
                class="transaction-search"
                placeholder="Cari ID, nomor tujuan, produk..."
                autocomplete="off"
            >

            <select
                id="transactionFilter"
                class="transaction-filter"
            >
                <option value="ALL">Semua status</option>
                <option value="PENDING">Pending</option>
                <option value="SUCCESS">Berhasil</option>
                <option value="FAILED">Gagal</option>
            </select>

            <button
                type="button"
                class="refresh-button"
                onclick="loadTransactions()"
            >
                ↻ Refresh
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Transaksi</th>
                        <th>Layanan</th>
                        <th>Tujuan</th>
                        <th>Produk</th>
                        <th>Harga</th>
                        <th>Pembayaran</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="transactionTable">

                    <tr>
                        <td colspan="7" class="empty">
                            Memuat transaksi...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

    const rupiah = new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    );


    function formatMonth(month) {

        if (!month) return "";

        const [year, monthNumber] = month.split("-");

        const date =
            new Date(
                Number(year),
                Number(monthNumber) - 1,
                1
            );

        return date.toLocaleDateString(
            "id-ID",
            {
                month: "long",
                year: "numeric"
            }
        );

    }


    function setupTransactionMonths() {

        const select =
            document.getElementById("transactionMonth");

        if (!select) return;

        const now = new Date();

        const currentYear =
            now.getFullYear();

        const currentMonth =
            now.getMonth();

        select.innerHTML = "";

        for (let i = 0; i < 12; i++) {

            const date =
                new Date(
                    currentYear,
                    currentMonth - i,
                    1
                );

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const value =
                `${year}-${month}`;

            const option =
                document.createElement("option");

            option.value = value;
            option.textContent =
                formatMonth(value);

            select.appendChild(option);

        }

    }


    async function resetCurrentMonth() {

        const select =
            document.getElementById("transactionMonth");

        const month =
            select
                ? select.value
                : new Date()
                    .toISOString()
                    .slice(0, 7);

        const monthName =
            formatMonth(month);

        const confirmed =
            confirm(
                `Reset semua transaksi bulan ${monthName}?\n\n` +
                `Semua transaksi pada periode ini akan dihapus permanen.\n` +
                `Transaksi bulan lainnya tidak akan terhapus.`
            );

        if (!confirmed) return;

        try {

            const response =
                await fetch(
                    "/api/transactions",
                    {
                        method: "DELETE",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            month
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Gagal mereset transaksi."
                );

            }

            alert(
                `Berhasil mereset ${data.deleted} transaksi bulan ${monthName}.`
            );

            await loadTransactions();

        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Gagal mereset transaksi."
            );

        }

    }


    async function loadTransactions() {

        try {

            const monthSelect =
                document.getElementById("transactionMonth");

            const month =
                monthSelect
                    ? monthSelect.value
                    : "";

            const url =
                month
                    ? `/api/transactions?month=${encodeURIComponent(month)}`
                    : "/api/transactions";

            const response =
                await fetch(url);

const data =
                await response.json();

            if (!data.success) {
                throw new Error("Gagal mengambil transaksi");
            }

            const transactions =
                data.transactions || [];

            document.getElementById(
                "totalTransactions"
            ).textContent = transactions.length;

            const pending =
                transactions.filter(
                    item => item.status === "PENDING"
                ).length;

            const success =
                transactions.filter(
                    item => item.status === "SUCCESS"
                ).length;

            const total =
                transactions.reduce(
                    (sum, item) =>
                        sum + Number(item.price || 0),
                    0
                );

            document.getElementById(
                "pendingTransactions"
            ).textContent = pending;

            document.getElementById(
                "successTransactions"
            ).textContent = success;

            document.getElementById(
                "totalAmount"
            ).textContent = rupiah.format(total);

            const searchInput =
                document.getElementById("transactionSearch");

            const filterInput =
                document.getElementById("transactionFilter");

            const search =
                (searchInput?.value || "")
                    .trim()
                    .toLowerCase();

            const statusFilter =
                filterInput?.value || "ALL";

            const filtered =
                transactions.filter(item => {

                    const text = [
                        item.transactionId,
                        item.reference,
                        item.service,
                        item.target,
                        item.productName,
                        item.paymentMethod,
                        item.status
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                    const matchesSearch =
                        !search || text.includes(search);

                    const matchesStatus =
                        statusFilter === "ALL" ||
                        item.status === statusFilter;

                    return matchesSearch && matchesStatus;
                });

            const tbody =
                document.getElementById("transactionTable");

            if (!filtered.length) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            ${
                                transactions.length
                                    ? "Tidak ada transaksi yang cocok."
                                    : "Belum ada transaksi."
                            }
                        </td>
                    </tr>
                `;

                return;
            }

            tbody.innerHTML =
                filtered.map(
                    item => `
                    <tr>

                        <td>
                            <button
                                type="button"
                                onclick="showTransactionDetail('${item.transactionId}')"
                                style="
                                    border:0;
                                    background:none;
                                    padding:0;
                                    margin:0;
                                    color:#171717;
                                    font-weight:700;
                                    cursor:pointer;
                                    text-decoration:underline;
                                    text-underline-offset:3px;
                                "
                            >
                                ${item.transactionId}
                            </button>
                        </td>

                        <td>
                            ${item.service}
                        </td>

                        <td>
                            ${item.target}
                        </td>

                        <td>
                            ${item.productName}
                        </td>

                        <td>
                            ${rupiah.format(item.price)}
                        </td>

                        <td>
                            ${item.paymentMethod}
                        </td>

                        <td>

                            <span class="status">
                                ${item.status}
                            </span>

                            ${
                                item.status === "PENDING"
                                    ? `
                                    <div style="
                                        display:flex;
                                        gap:6px;
                                        margin-top:8px;
                                    ">

                                        <button
                                            onclick="updateStatus('${item.transactionId}', 'SUCCESS')"
                                            style="
                                                border:0;
                                                border-radius:8px;
                                                padding:6px 9px;
                                                cursor:pointer;
                                                background:#171717;
                                                color:white;
                                                font-size:11px;
                                            "
                                        >
                                            Berhasil
                                        </button>

                                        <button
                                            onclick="updateStatus('${item.transactionId}', 'FAILED')"
                                            style="
                                                border:1px solid #ddd;
                                                border-radius:8px;
                                                padding:6px 9px;
                                                cursor:pointer;
                                                background:white;
                                                color:#171717;
                                                font-size:11px;
                                            "
                                        >
                                            Gagal
                                        </button>

                                    </div>
                                    `
                                    : ""
                            }

                        </td>

                    </tr>
                    `
                ).join("");

        } catch (error) {

            console.error(error);

            document.getElementById(
                "transactionTable"
            ).innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Gagal memuat transaksi.
                    </td>
                </tr>
            `;

        }

    }


    setupTransactionMonths();
    loadTransactions();

    setInterval(() => {
        loadTransactions();
    }, 10000);

async function updateStatus(transactionId, status) {

    const response = await fetch(
        `/api/transactions/${transactionId}/status`,
        {
            method: "PATCH",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                status: status
            })
        }
    );

    const data = await response.json();

    if (!data.success) {

        alert(
            data.error || "Gagal mengubah status."
        );

        return;
    }

    loadTransactions();

}




    async function showTransactionDetail(transactionId) {

        const modal =
            document.getElementById("transactionModal");

        const content =
            document.getElementById(
                "transactionDetailContent"
            );

        modal.style.display = "flex";

        content.innerHTML = `
            <div style="
                padding:30px 10px;
                text-align:center;
                color:#888;
            ">
                Memuat detail transaksi...
            </div>
        `;

        try {

            const response =
                await fetch(
                    `/api/transactions/${encodeURIComponent(transactionId)}`
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error ||
                    "Gagal mengambil detail transaksi."
                );
            }

            const item =
                data.transaction ||
                data.data ||
                data;

            window.currentTransactionForReceipt = item;

            const rows = [
                ["Transaction ID", item.transactionId],
                ["Reference", item.reference],
                ["Layanan", item.service],
                ["Tujuan", item.target],
                ["Operator", item.operator],
                ["Produk", item.productName],
                ["Harga", rupiah.format(Number(item.price || 0))],
                ["Pembayaran", item.paymentMethod],
                ["Status", item.status],
                ["Waktu", item.createdAt]
            ];

            content.innerHTML = rows
                .map(([label, value]) => `
                    <div style="
                        display:flex;
                        justify-content:space-between;
                        gap:20px;
                        padding:13px 0;
                        border-bottom:1px solid #eee;
                    ">
                        <span style="
                            color:#888;
                            font-size:13px;
                        ">
                            ${label}
                        </span>

                        <strong style="
                            text-align:right;
                            font-size:13px;
                            word-break:break-word;
                        ">
                            ${value ?? "-"}
                        </strong>
                    </div>
                `)
                .join("");

        } catch (error) {

            console.error(error);

            content.innerHTML = `
                <div style="
                    padding:30px 10px;
                    text-align:center;
                    color:#888;
                ">
                    Gagal memuat detail transaksi.
                </div>
            `;
        }
    }



    function printTransactionReceipt() {
        const item = window.currentTransactionForReceipt;
        if (!item) {
            alert("Detail transaksi belum tersedia.");
            return;
        }

        const w = window.open("", "_blank", "width=800,height=900");
        if (!w) {
            alert("Popup diblokir browser. Izinkan popup untuk halaman admin.");
            return;
        }

        const price = rupiah.format(Number(item.price || 0));

        w.document.write(`

<title>Bukti Transaksi ${item.transactionId || ""}</title>

.brand{font-size:24px;font-weight:800}.sub{color:#888;font-size:13px;margin-bottom:25px}
h1{font-size:20px}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}
.label{color:#888}.value{text-align:right;font-weight:700;word-break:break-word}
.total{margin-top:20px;padding-top:18px;border-top:2px solid #171717;display:flex;justify-content:space-between;font-weight:800}

</style>

</head>
<body>
<div class="receipt">
<div class="brand">PPOBKU</div>
<div class="sub">Bukti transaksi</div>
<h1>Detail Transaksi</h1>
<div class="row"><span class="label">Transaction ID</span><span class="value">${item.transactionId ?? "-"}</span></div>

<div class="row"><span class="label">Layanan</span><span class="value">${item.service ?? "-"}</span></div>
<div class="row"><span class="label">Tujuan</span><span class="value">${item.target ?? "-"}</span></div>

        `);
        w.document.close();
        w.focus();
        setTimeout(() => w.print(), 300);
    }

    function closeTransactionDetail() {

        document.getElementById(
            "transactionModal"
        ).style.display = "none";

    }


    document.getElementById(
        "transactionModal"
    ).addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "transactionModal"
            ) {
                closeTransactionDetail();
            }

        }
    );

</script>


<div
    id="transactionModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        z-index:9999;
        background:rgba(0,0,0,.35);
        padding:24px;
        align-items:center;
        justify-content:center;
    "
>
    <div
        style="
            width:min(520px,100%);
            max-height:90vh;
            overflow:auto;
            background:white;
            border-radius:20px;
            padding:24px;
            box-shadow:0 20px 60px rgba(0,0,0,.18);
        "
    >

        <div
            style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:16px;
                margin-bottom:20px;
            "
        >
            <strong style="font-size:20px;">
                Detail transaksi
            </strong>

            <button
                type="button"
                onclick="closeTransactionDetail()"
                style="
                    border:0;
                    background:#f3f1ec;
                    width:34px;
                    height:34px;
                    border-radius:50%;
                    cursor:pointer;
                    font-size:18px;
                "
            >
                ×
            </button>
        </div>

        <div id="transactionDetailContent">
            Memuat detail...
        </div>

        <div style="display:flex;justify-content:flex-end;margin-top:18px;">
            <button
                type="button"
                onclick="printTransactionReceipt()"
                style="border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:#171717;color:white;font-size:13px;font-weight:700;"
            >
                🧾 Cetak Bukti
            </button>
        </div>

    </div>
</div>

</body>

</html>
