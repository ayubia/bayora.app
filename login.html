<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masuk — BAYORA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 20px;
            background:
                radial-gradient(
                    circle at 80% 15%,
                    rgba(18, 199, 244, .12),
                    transparent 32%
                ),
                #f5f9ff;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: rgba(255,255,255,.96);
            border: 1px solid #e3eaf4;
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(20,65,120,.08);
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                rgba(23,105,255,.10),
                rgba(22,199,255,.15)
            );
            font-size: 25px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #102957;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: -.7px;
            margin-bottom: 9px;
        }

        .auth-header p {
            color: #7b899d;
            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .auth-field label {
            color: #102957;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-input-wrap {
            position: relative;
        }

        .auth-input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #dfe7f1;
            border-radius: 12px;
            outline: none;
            background: #fbfdff;
            color: #102957;
            font-family: inherit;
            font-size: 14px;
            transition: .2s ease;
        }

        .auth-input:focus {
            border-color: #1677ff;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(22,119,255,.08);
        }

        .password-input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #7b899d;
            cursor: pointer;
            font-size: 16px;
        }

        .auth-button {
            width: 100%;
            height: 50px;
            margin-top: 6px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #1268ff,
                #12c7f4
            );
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 9px 22px rgba(18,105,255,.18);
            transition: .2s ease;
        }

        .auth-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 27px rgba(18,105,255,.24);
        }

        .auth-button:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.45;
        }

        .auth-message.error {
            display: block;
            color: #b42318;
            background: #fff1f0;
            border: 1px solid #ffd5d2;
        }

        .auth-message.success {
            display: block;
            color: #087443;
            background: #ecfdf3;
            border: 1px solid #b7ebca;
        }

        .auth-switch {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #edf1f6;
            text-align: center;
            color: #7b899d;
            font-size: 13px;
        }

        .auth-switch a {
            color: #1268ff;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .auth-page {
                min-height: calc(100vh - 64px);
                padding: 40px 16px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .auth-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <a href="/" class="logo">BAYORA</a>

    <nav>
        <a href="/">Beranda</a>
    </nav>
</header>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-icon">👤</div>

        <div class="auth-header">
            <h1>Selamat datang</h1>
            <p>Masuk ke akun BAYORA kamu</p>
        </div>

        <form id="loginForm" class="auth-form">

            <div class="auth-field">
                <label for="loginIdentifier">
                    Email atau nomor HP
                </label>

                <input
                    id="loginIdentifier"
                    class="auth-input"
                    type="text"
                    autocomplete="username"
                    placeholder="Masukkan email atau nomor HP"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="loginPassword">
                    Password
                </label>

                <div class="auth-input-wrap">
                    <input
                        id="loginPassword"
                        class="auth-input password-input"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Masukkan password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)"
                        aria-label="Tampilkan password"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div id="loginMessage" class="auth-message"></div>

            <button
                id="loginButton"
                class="auth-button"
                type="submit"
            >
                Masuk
            </button>

        </form>

        <div class="auth-switch">
            Belum punya akun?
            <a href="/register.html">Daftar sekarang</a>
        </div>

    </section>

</main>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
    } else {
        input.type = "password";
        button.textContent = "👁";
    }
}

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const identifier =
            document.getElementById("loginIdentifier").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("loginMessage");

        button.disabled = true;
        button.textContent = "Memproses...";

        message.className = "auth-message";
        message.textContent = "";

        try {

            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    identifier,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error || "Login gagal."
                );
            }

            message.className =
                "auth-message success";

            message.textContent =
                "Login berhasil. Mengarahkan...";

            setTimeout(() => {
                window.location.href = "/";
            }, 700);

        } catch (error) {

            message.className =
                "auth-message error";

            message.textContent =
                error.message;

        } finally {

            button.disabled = false;
            button.textContent = "Masuk";

        }
    });
</script>


<script>
/* BAYORA_AUTH_LOGIN_CONNECTED */

(function () {
    const form = document.getElementById("loginForm");

    if (!form) return;

    const message =
        document.getElementById("loginMessage") ||
        document.createElement("div");

    if (!message.id) {
        message.id = "loginMessage";
        message.className = "auth-message";
        form.prepend(message);
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const button = form.querySelector(".auth-button");

        const identifier =
            document.getElementById("loginIdentifier").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        message.className = "auth-message";
        message.textContent = "";

        if (button) {
            button.disabled = true;
            button.textContent = "Memproses...";
        }

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    identifier,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error || "Login gagal."
                );
            }

            message.className = "auth-message success";
            message.textContent = "Login berhasil. Mengarahkan...";

            setTimeout(function () {
                window.location.href = "/";
            }, 500);

        } catch (error) {
            message.className = "auth-message error";
            message.textContent = error.message;

            if (button) {
                button.disabled = false;
                button.textContent = "Masuk";
            }
        }
    });
})();
</script>

</body>
</html>
