<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — BAYORA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f7f9fc;
    color: #142b52;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.profile-page {
    width: min(680px, 92%);
    margin: 0 auto;
    padding: 70px 0;
}

.back {
    display: inline-block;
    margin-bottom: 28px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}

.back:hover {
    color: #1264d8;
}

.eyebrow {
    margin: 0 0 8px;
    color: #2478e8;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

h1 {
    margin: 0 0 30px;
    color: #142b52;
    font-size: 34px;
    line-height: 1.15;
}

.profile-card {
    padding: 28px;
    background: #fff;
    border: 1px solid #e8edf5;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(15,42,80,.08);
}

.field {
    padding: 16px 0;
    border-bottom: 1px solid #edf0f5;
}

.field:first-child {
    padding-top: 0;
}

.field:last-child {
    padding-bottom: 0;
    border-bottom: 0;
}

.label {
    margin-bottom: 6px;
    color: #7b8798;
    font-size: 12px;
}

.value {
    color: #142b52;
    font-size: 15px;
    font-weight: 500;
    word-break: break-word;
}

.error {
    color: #c62828;
}


/* ==========================================================
   AKSI AKUN
========================================================== */

.account-actions {
    margin-top: 18px;
    padding: 20px;

    background: #fff;
    border: 1px solid #e8edf5;
    border-radius: 18px;

    box-shadow: 0 14px 40px rgba(15,42,80,.06);
}

.account-actions-title {
    margin: 0 0 12px;

    color: #142b52;

    font-size: 14px;
    font-weight: 700;
}

.account-action {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 46px;

    box-sizing: border-box;

    margin-top: 10px;
    padding: 10px 14px;

    border-radius: 11px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease;
}

.account-logout {
    color: #1264d8;
    background: #f1f7ff;
    border: 1px solid #d8e8ff;
}

.account-logout:hover {
    background: #e4f0ff;
}

.account-delete {
    color: #c62828;
    background: #fff5f5;
    border: 1px solid #ffdada;
}

.account-delete:hover {
    background: #ffeaea;
}

@media (max-width: 700px) {

    .account-actions {
        padding: 18px;
    }

    .account-action {
        min-height: 48px;
    }
}

@media (max-width: 700px) {
    .profile-page {
        padding: 45px 0;
    }

    h1 {
        font-size: 28px;
    }

    .profile-card {
        padding: 22px;
    }
}
</style>
</head>

<body>

<main class="profile-page">

    <a class="back" href="/">
        ← Kembali ke Beranda
    </a>

    <p class="eyebrow">AKUN</p>

    <h1>Profil</h1>

    <section id="profileCard" class="profile-card">
        Memuat profil...
    </section>


    <section class="account-actions">

        <p class="account-actions-title">
            Aksi Akun
        </p>

        <button
            type="button"
            class="account-action account-logout"
            id="profileLogout"
        >
            Logout
        </button>

        <button
            type="button"
            class="account-action account-delete"
            id="profileDelete"
        >
            Hapus Akun
        </button>

    </section>

</main>

<script>
async function loadProfile() {

    const card = document.getElementById("profileCard");

    try {

        const response = await fetch(
            "/api/auth/profile",
            {
                credentials: "include"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            window.location.href = "/login.html";
            return;
        }

        const user = data.user;

        const date = user.created_at
            ? new Date(user.created_at).toLocaleDateString(
                "id-ID",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            )
            : "-";

        card.innerHTML = `
            <div class="field">
                <div class="label">Nama</div>
                <div class="value">${escapeHtml(user.name)}</div>
            </div>

            <div class="field">
                <div class="label">Nomor HP</div>
                <div class="value">${escapeHtml(user.phone)}</div>
            </div>

            <div class="field">
                <div class="label">Email</div>
                <div class="value">${escapeHtml(user.email)}</div>
            </div>

            <div class="field">
                <div class="label">Terdaftar sejak</div>
                <div class="value">${escapeHtml(date)}</div>
            </div>
        `;

    } catch (error) {

        card.innerHTML = `
            <div class="error">
                Gagal memuat profil.
            </div>
        `;
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ==========================================================
   LOGOUT DARI PROFILE
========================================================== */

const profileLogout =
    document.getElementById("profileLogout");

if (profileLogout) {

    profileLogout.addEventListener(
        "click",
        async function () {

            const confirmed =
                window.confirm(
                    "Apakah kamu yakin ingin logout?"
                );

            if (!confirmed) {
                return;
            }

            profileLogout.disabled = true;

            try {

                const response =
                    await fetch(
                        "/api/auth/logout",
                        {
                            method: "POST",
                            credentials: "include"
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data.error ||
                        "Logout gagal."
                    );
                }

                window.location.href =
                    "/login.html";

            } catch (error) {

                profileLogout.disabled = false;

                alert(
                    error.message ||
                    "Logout gagal."
                );
            }

        }
    );

}


/* ==========================================================
   HAPUS AKUN DARI PROFILE
========================================================== */

const profileDelete =
    document.getElementById("profileDelete");

if (profileDelete) {

    profileDelete.addEventListener(
        "click",
        async function () {

            const confirmed =
                window.confirm(
                    "Apakah kamu yakin ingin menghapus akun secara permanen?"
                );

            if (!confirmed) {
                return;
            }

            profileDelete.disabled = true;

            try {

                const response =
                    await fetch(
                        "/api/auth/delete-account",
                        {
                            method: "DELETE",
                            credentials: "include"
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data.error ||
                        "Gagal menghapus akun."
                    );
                }

                alert(
                    "Akun berhasil dihapus."
                );

                window.location.href =
                    "/login.html";

            } catch (error) {

                profileDelete.disabled = false;

                alert(
                    error.message ||
                    "Gagal menghapus akun."
                );
            }

        }
    );

}


loadProfile();
</script>

</body>
</html>
