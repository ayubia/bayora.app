<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Transaksi — BAYORA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f7f9fc;
    color: #142b52;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.history-page {
    width: min(760px, 92%);
    margin: 0 auto;
    padding: 70px 0;
}

.back {
    display: inline-block;
    margin-bottom: 28px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}

.back:hover {
    color: #1264d8;
}

.eyebrow {
    margin: 0 0 8px;
    color: #2478e8;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

h1 {
    margin: 0 0 28px;
    color: #142b52;
    font-size: 34px;
    line-height: 1.15;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.transaction-card {
    padding: 20px;
    background: #fff;
    border: 1px solid #e8edf5;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(15,42,80,.05);
}

.transaction-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
}

.product-name {
    color: #142b52;
    font-size: 15px;
    font-weight: 600;
}

.target {
    margin-top: 5px;
    color: #7b8798;
    font-size: 13px;
}

.price {
    color: #142b52;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 12px;
    margin-top: 15px;
    color: #7b8798;
    font-size: 12px;
}

.status {
    display: inline-flex;
    padding: 4px 9px;
    border-radius: 999px;
    background: #eef5ff;
    color: #1769d3;
    font-size: 11px;
    font-weight: 600;
}

.empty {
    padding: 50px 20px;
    background: #fff;
    border: 1px solid #e8edf5;
    border-radius: 16px;
    color: #7b8798;
    text-align: center;
    font-size: 14px;
}

.error {
    color: #c62828;
}

@media (max-width: 700px) {

    .history-page {
        padding: 45px 0;
    }

    h1 {
        font-size: 28px;
    }

    .transaction-top {
        flex-direction: column;
        gap: 8px;
    }

    .price {
        font-size: 14px;
    }
}
</style>
    <link rel="icon" href="/favicon.ico?v=bayora" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=bayora">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bayora">
</head>

<body>

<main class="history-page">

    <a class="back" href="/">
        ← Kembali ke Beranda
    </a>

    <p class="eyebrow">AKUN</p>

    <h1>Riwayat Transaksi</h1>

    <section id="historyList" class="history-list">
        <div class="empty">
            Memuat riwayat transaksi...
        </div>
    </section>

</main>

<script>
async function loadHistory() {

    const list = document.getElementById("historyList");

    try {

        const response = await fetch(
            "/api/auth/history",
            {
                credentials: "include"
            }
        );

        const data = await response.json();

        if (response.status === 401 || !data.success) {
            window.location.href = "/login.html";
            return;
        }

        if (!data.transactions.length) {

            list.innerHTML = `
                <div class="empty">
                    Belum ada transaksi pada akun ini.
                </div>
            `;

            return;
        }

        list.innerHTML =
            data.transactions
                .map(renderTransaction)
                .join("");

    } catch (error) {

        list.innerHTML = `
            <div class="empty error">
                Gagal memuat riwayat transaksi.
            </div>
        `;
    }
}

function renderTransaction(transaction) {

    const date = transaction.createdAt
        ? new Date(transaction.createdAt).toLocaleString(
            "id-ID",
            {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        )
        : "-";

    const price =
        Number(transaction.price || 0)
            .toLocaleString("id-ID");

    const status =
        transaction.status || "PENDING";

    return `
        <article class="transaction-card">

            <div class="transaction-top">

                <div>
                    <div class="product-name">
                        ${escapeHtml(transaction.productName)}
                    </div>

                    <div class="target">
                        ${escapeHtml(transaction.target)}
                    </div>
                </div>

                <div class="price">
                    Rp ${price}
                </div>

            </div>

            <div class="meta">

                <span class="status">
                    ${escapeHtml(status)}
                </span>

                <span>
                    ${escapeHtml(date)}
                </span>

                <span>
                    ${escapeHtml(transaction.transactionId)}
                </span>

            </div>

        </article>
    `;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadHistory();
</script>

</body>
</html>
