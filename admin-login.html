<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PPOBKU — Login Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f7f6f2;
            color: #171717;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login {
            width: 100%;
            max-width: 420px;
            padding: 34px;
            background: white;
            border: 1px solid #e7e4dd;
            border-radius: 22px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .label {
            margin-top: 45px;
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        h1 {
            margin: 8px 0 28px;
            font-size: 32px;
        }

        input {
            width: 100%;
            margin-bottom: 14px;
            padding: 14px 15px;
            border: 1px solid #ddd9d0;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #171717;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #171717;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            display: none;
            margin-top: 14px;
            color: #b42318;
            font-size: 13px;
        }
    </style>

</head>


<body>

<div class="login">

    <div class="logo">
        PPOBKU
    </div>

    <div class="label">
        ADMIN
    </div>

    <h1>
        Masuk
    </h1>

    <form id="loginForm">

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Masuk ke Dashboard
        </button>

    </form>

    <div id="error" class="error">
        Username atau password salah.
    </div>

</div>


<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async (event) => {

            event.preventDefault();

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            const response =
                await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                document
                    .getElementById("error")
                    .style.display = "block";

                return;

            }


            window.location.href =
                "/admin.html";

        });

</script>

</body>

</html>
