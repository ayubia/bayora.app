<head>
<meta charset="UTF-8">

<style>
* {

.product-name {

}

========================= */

}

.feedback-modal-title {

    font-size: 20px;

.feedback-modal-subtitle {
    margin: 6px 0 0;

    font-size: 13px;

}

.feedback-modal-close {

    height: 34px;
    border: 0;
    border-radius: 50%;
    background: #f3f6fa;
    color: #536176;

    cursor: pointer;
}

.feedback-stars {

    margin: 24px 0 20px;

.feedback-star {

}

.feedback-review-label {

    font-size: 12px;

}

.feedback-review {

    resize: vertical;

    border-radius: 12px;

.feedback-review:focus {

.feedback-submit:disabled {

}

.feedback-message {

@media (max-width: 700px) {
    .transaction-feedback-actions {

<body>

<main class="history-page">

    <a class="back" href="/">
        ← Kembali ke Beranda
    </a>

    <p class="eyebrow">AKUN</p>

    <h1>Riwayat Transaksi</h1>

    <div
        id="historyCategoryTabs"
        class="history-tabs"
        role="tablist"
        aria-label="Kategori transaksi"
    >
        <button
            type="button"
            class="history-tab active"
            data-history-type="ALL"
        >
            Semua
        </button>

        <button
            type="button"
            class="history-tab"
            data-history-type="PPOB"
        >
            PPOB
        </button>

            type="button"
            class="history-tab"
            data-history-type="DIGITAL"
        >
            Produk Digital
        </button>

        <button
            type="button"
            class="history-tab"
            data-history-type="SMM"
        >
            SMM
        </button>
    </div>

    <section id="historyList" class="history-list">
        <div class="empty">
            Memuat riwayat transaksi...
        </div>
    </section>

</main>

<script>

let feedbackTransactionId = "";
let feedbackRating = 0;

function transactionCanBeReceived(transaction) {
    const status =
        String(transaction?.status || "")
        .trim()
        .toUpperCase();

    return [
        "SUCCESS",
        "COMPLETED",
        "SUCCESSFUL",
        "DELIVERED"
    ].includes(status);
}

function transactionCanBeReported(transaction) {
    const status =
        String(transaction?.status || "")
        .trim()
        .toUpperCase();

    const paymentStatus =
        String(transaction?.paymentStatus || "")
        .trim()
        .toUpperCase();

    const failedStatuses = [
        "FAILED",
        "FAIL",
        "ERROR"
    ];

    return (
        paymentStatus === "PAID" &&
        failedStatuses.includes(status)
    );
}

function getTransactionStatusLabel(transaction) {
    const status =
        String(transaction?.status || "PENDING")
        .trim()
        .toUpperCase();

    if (status === "PENDING") {
        return "Menunggu Diproses";
    }

    if (
        status === "PROCESSING" ||
        status === "IN_PROGRESS"
    ) {
        return "Sedang Diproses";
    }

    if (
        status === "SUCCESS" ||
        status === "SUCCESSFUL" ||
        status === "COMPLETED" ||
        status === "DELIVERED"
    ) {
        return "Berhasil";
    }

    if (
        status === "FAILED" ||
        status === "FAIL" ||
        status === "ERROR"
    ) {
        return "Gagal";
    }

    if (
        status === "CANCELLED" ||
        status === "CANCELED"
    ) {
        return "Dibatalkan";
    }

    return status;
}

async function copyTransactionCode(
    transactionId,
    button
) {
    const value = String(transactionId || "");

    if (!value) return;

    try {
        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {
            await navigator.clipboard.writeText(value);
        } else {
            const textarea =
                document.createElement("textarea");

            textarea.value = value;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);
            textarea.select();

            document.execCommand("copy");
            textarea.remove();
        }

        if (button) {
            const oldText = button.textContent;
            button.textContent = "Tersalin ✓";
            button.disabled = true;

            setTimeout(() => {
                button.textContent = oldText;
                button.disabled = false;
            }, 1300);
        }

    } catch (error) {
        console.error("[COPY TRANSACTION]", error);

        window.prompt(
            "Salin kode transaksi:",
            value
        );
    }
}

async function sendTransactionFeedback(
    transactionId,
    action
) {
    const response =
        await fetch(
            "/api/auth/transaction-feedback",
            {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    transactionId,
                    action
                })
            }
        );

    const data = await response.json();

    if (!response.ok || !data.success) {
        throw new Error(
            data.error ||
            "Gagal menyimpan konfirmasi."
        );
    }

    return data;
}

async function markTransactionReceived(
    transactionId,
    button
) {
    if (!transactionId) return;

    const confirmed = window.confirm(
        "Pastikan layanan/produk sudah benar-benar kamu terima. Lanjutkan?"
    );

    if (!confirmed) return;

    const original =
        button?.textContent || "";

    try {
        if (button) {
            button.disabled = true;
            button.textContent = "Menyimpan...";
        }

        await sendTransactionFeedback(
            transactionId,
            "RECEIVED"
        );

        openFeedbackModal(transactionId);

        if (button) {
            button.textContent =
                "✓ Sudah Diterima";
        }

        const card =
            button?.closest(
                ".transaction-card"
            );

        if (card) {
            card
                .querySelectorAll(
                    ".transaction-feedback-button"
                )
                .forEach(item => {
                    item.disabled = true;
                });
        }

    } catch (error) {
        alert(error.message);

        if (button) {
            button.disabled = false;
            button.textContent = original;
        }
    }
}

function openComplaintContactForm(transactionId, button) {
    const old =
        document.getElementById(
            "complaintContactModal"
        );

    if (old) old.remove();

    const modal =
        document.createElement("div");

    modal.id =
        "complaintContactModal";

    modal.className =
        "complaint-contact-overlay";

    modal.innerHTML = `
        <div
            class="complaint-contact-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="complaintContactTitle"
        >
            <button
                type="button"
                class="complaint-contact-close"
                aria-label="Tutup"
            >
                ×
            </button>

            <div class="complaint-contact-icon">
                !
            </div>

            <h3 id="complaintContactTitle">
                Belum Diterima
            </h3>

            <p class="complaint-contact-description">
                Masukkan kontak yang dapat dihubungi admin untuk membantu menangani transaksi ini.
            </p>

            <label class="complaint-contact-label">
                Nama
                <input
                    id="complaintContactName"
                    class="complaint-contact-input"
                    type="text"
                    maxlength="100"
                    autocomplete="name"
                    placeholder="Nama yang dapat dihubungi"
                >
            </label>

            <label class="complaint-contact-label">
                Nomor WhatsApp
                <input
                    id="complaintContactWhatsapp"
                    class="complaint-contact-input"
                    type="tel"
                    maxlength="25"
                    autocomplete="tel"
                    inputmode="tel"
                    placeholder="Contoh: 081234567890"
                >
            </label>

            <div class="complaint-contact-or">
                atau
            </div>

            <label class="complaint-contact-label">
                Email
                <input
                    id="complaintContactEmail"
                    class="complaint-contact-input"
                    type="email"
                    maxlength="150"
                    autocomplete="email"
                    placeholder="nama@email.com"
                >
            </label>

            <div
                id="complaintContactMessage"
                class="complaint-contact-message"
            ></div>

            <div class="complaint-contact-actions">
                <button
                    type="button"
                    class="complaint-contact-cancel"
                >
                    Batal
                </button>

                <button
                    type="button"
                    class="complaint-contact-submit"
                >
                    Kirim Laporan
                </button>
            </div>

            <div class="complaint-contact-note">
                Isi minimal nomor WhatsApp atau email agar admin dapat menghubungimu.
            </div>
        </div>
    `;

    document.body.appendChild(modal);

    requestAnimationFrame(() => {
        modal.classList.add("open");
    });

    const close = () => {
        modal.classList.remove("open");

        window.setTimeout(
            () => modal.remove(),
            180
        );
    };

    modal
        .querySelector(
            ".complaint-contact-close"
        )
        ?.addEventListener(
            "click",
            close
        );

    modal
        .querySelector(
            ".complaint-contact-cancel"
        )
        ?.addEventListener(
            "click",
            close
        );

    modal.addEventListener(
        "click",
        event => {
            if (event.target === modal) {
                close();
            }
        }
    );

    modal
        .querySelector(
            ".complaint-contact-submit"
        )
        ?.addEventListener(
            "click",
            async () => {
                const name =
                    document
                        .getElementById(
                            "complaintContactName"
                        )
                        ?.value
                        .trim() || "";

                const whatsapp =
                    document
                        .getElementById(
                            "complaintContactWhatsapp"
                        )
                        ?.value
                        .trim() || "";

                const email =
                    document
                        .getElementById(
                            "complaintContactEmail"
                        )
                        ?.value
                        .trim() || "";

                const message =
                    document.getElementById(
                        "complaintContactMessage"
                    );

                if (!name) {
                    if (message) {
                        message.textContent =
                            "Nama wajib diisi.";
                    }
                    return;
                }

                if (!whatsapp && !email) {
                    if (message) {
                        message.textContent =
                            "Isi minimal nomor WhatsApp atau email.";
                    }
                    return;
                }

                if (
                    whatsapp &&
                    !/^[+0-9][0-9\s\-()]{7,24}$/.test(
                        whatsapp
                    )
                ) {
                    if (message) {
                        message.textContent =
                            "Nomor WhatsApp tidak valid.";
                    }
                    return;
                }

                if (
                    email &&
                    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                        email
                    )
                ) {
                    if (message) {
                        message.textContent =
                            "Email tidak valid.";
                    }
                    return;
                }

                const submit =
                    modal.querySelector(
                        ".complaint-contact-submit"
                    );

                const original =
                    submit?.textContent || "";

                try {
                    if (submit) {
                        submit.disabled = true;
                        submit.textContent =
                            "Mengirim...";
                    }

                    if (button) {
                        button.disabled = true;
                        button.textContent =
                            "Mengirim laporan...";
                    }

                    const response =
                        await fetch(
                            "/api/auth/transaction-feedback",
                            {
                                method: "POST",
                                credentials: "include",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify({
                                        transactionId,
                                        action:
                                            "NOT_RECEIVED",
                                        contactName:
                                            name,
                                        contactWhatsapp:
                                            whatsapp,
                                        contactEmail:
                                            email
                                    })
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        !response.ok ||
                        !data.success
                    ) {
                        throw new Error(
                            data.error ||
                            "Gagal mengirim laporan."
                        );
                    }

                    close();

                    if (button) {
                        button.textContent =
                            "Laporan Terkirim ✓";
                    }

                    alert(
                        "Laporan berhasil dikirim ke admin."
                    );

                    await loadHistory();

                } catch (error) {
                    if (message) {
                        message.textContent =
                            error.message ||
                            "Gagal mengirim laporan.";
                    }

                    if (submit) {
                        submit.disabled = false;
                        submit.textContent =
                            original;
                    }

                    if (button) {
                        button.disabled = false;
                        button.textContent =
                            "Belum Diterima";
                    }
                }
            }
        );

    document
        .getElementById(
            "complaintContactName"
        )
        ?.focus();
}

async function markTransactionNotReceived(
    transactionId,
    button
) {
    if (!transactionId) return;

    openComplaintContactForm(
        transactionId,
        button
    );
}

function openFeedbackModal(transactionId) {
    feedbackTransactionId =
        String(transactionId || "");

    feedbackRating = 0;

    const modal =
        document.getElementById(
            "feedbackModal"
        );

    const review =
        document.getElementById(
            "feedbackReview"
        );

    const message =
        document.getElementById(
            "feedbackMessage"
        );

    if (review) review.value = "";
    if (message) message.textContent = "";

    updateFeedbackStars();

    if (modal) {
        modal.classList.add("open");
        modal.setAttribute(
            "aria-hidden",
            "false"
        );
    }
}

function closeFeedbackModal() {
    const modal =
        document.getElementById(
            "feedbackModal"
        );

    if (modal) {
        modal.classList.remove("open");
        modal.setAttribute(
            "aria-hidden",
            "true"
        );
    }
}

function updateFeedbackStars() {
    document
        .querySelectorAll(
            ".feedback-star"
        )
        .forEach(star => {
            const rating =
                Number(
                    star.dataset.rating
                );

            star.classList.toggle(
                "active",
                rating <= feedbackRating
            );
        });
}

async function submitTransactionReview() {
    if (!feedbackTransactionId) return;

    const message =
        document.getElementById(
            "feedbackMessage"
        );

    const submit =
        document.getElementById(
            "feedbackSubmit"
        );

    const review =
        document.getElementById(
            "feedbackReview"
        )?.value || "";

    if (
        !Number.isInteger(feedbackRating) ||
        feedbackRating < 1 ||
        feedbackRating > 5
    ) {
        if (message) {
            message.textContent =
                "Pilih 1–5 bintang terlebih dahulu.";
        }
        return;
    }

    try {
        if (submit) {
            submit.disabled = true;
            submit.textContent =
                "Mengirim...";
        }

        const response =
            await fetch(
                "/api/auth/transaction-feedback",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        transactionId:
                            feedbackTransactionId,
                        action: "REVIEW",
                        rating:
                            feedbackRating,
                        review
                    })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.error ||
                "Gagal mengirim penilaian."
            );
        }

        if (message) {
            message.textContent =
                "Terima kasih atas penilaianmu ✓";
        }

        if (submit) {
            submit.textContent =
                "Penilaian Terkirim ✓";
        }

        setTimeout(() => {
            closeFeedbackModal();
        }, 1100);

    } catch (error) {
        if (message) {
            message.textContent =
                error.message;
        }

        if (submit) {
            submit.disabled = false;
            submit.textContent =
                "Kirim Penilaian";
        }
    }
}

function setupFeedbackUI() {
    document
        .querySelectorAll(
            ".feedback-star"
        )
        .forEach(star => {
            star.addEventListener(
                "click",
                () => {
                    feedbackRating =
                        Number(
                            star.dataset.rating
                        );

                    updateFeedbackStars();
                }
            );
        });

    const modal =
        document.getElementById(
            "feedbackModal"
        );

    modal?.addEventListener(
        "click",
        event => {
            if (event.target === modal) {
                closeFeedbackModal();
            }
        }
    );
}



let historyTransactions = [];
let historyType = "ALL";

function normalizeHistoryType(transaction) {

    const explicit =
        String(
            transaction?.transactionType || ""
        )
        .trim()
        .toUpperCase();

    if (
        explicit === "PPOB" ||
        explicit === "DIGITAL" ||
        explicit === "SMM"
    ) {
        return explicit;
    }

    const transactionId =
        String(
            transaction?.transactionId || ""
        )
        .trim()
        .toUpperCase();

    if (transactionId.startsWith("SMM-")) {
        return "SMM";
    }

    if (transactionId.startsWith("DIGITAL-")) {
        return "DIGITAL";
    }

    return "PPOB";
}

function getHistoryTypeLabel(type) {

    if (type === "DIGITAL") {
        return "Produk Digital";
    }

    if (type === "SMM") {
        return "SMM";
    }

    return "PPOB";
}

function renderHistoryList() {

    const list =
        document.getElementById("historyList");

    if (!list) {
        return;
    }

    const filtered =
        historyType === "ALL"
            ? historyTransactions
            : historyTransactions.filter(
                transaction =>
                    normalizeHistoryType(
                        transaction
                    ) === historyType
            );

    if (!filtered.length) {

        const label =
            historyType === "ALL"
                ? "akun ini"
                : getHistoryTypeLabel(
                    historyType
                );

        list.innerHTML = `
            <div class="empty">
                ${
                    historyType === "ALL"
                        ? "Belum ada transaksi pada akun ini."
                        : `Belum ada transaksi ${escapeHtml(label)}.`
                }
            </div>
        `;

        return;
    }

    list.innerHTML =
        filtered
            .map(renderTransaction)
            .join("");
}

function setupHistoryTabs() {

    const tabs =
        document.querySelectorAll(
            "[data-history-type]"
        );

    tabs.forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                historyType =
                    String(
                        tab.dataset.historyType ||
                        "ALL"
                    )
                    .toUpperCase();

                tabs.forEach(item => {
                    item.classList.toggle(
                        "active",
                        item === tab
                    );
                });

                renderHistoryList();
            }
        );
    });
}


async function loadHistory() {

    const list = document.getElementById("historyList");

    try {

        const response = await fetch(
            "/api/auth/history",
            {
                credentials: "include"
            }
        );

        const data = await response.json();

        if (response.status === 401 || !data.success) {
            window.location.href = "/login.html";
            return;
        }

        historyTransactions =
            Array.isArray(data.transactions)
                ? data.transactions
                : [];

        renderHistoryList();

    } catch (error) {

        list.innerHTML = `
            <div class="empty error">
                Gagal memuat riwayat transaksi.
            </div>
        `;
    }
}


function getComplaintStatus(transaction) {
    return String(
        transaction?.complaintStatus || ""
    ).trim().toUpperCase();
}

function getComplaintLabel(status) {
    const labels = {
        OPEN: "Laporan Terkirim",
        CHECKING: "Dalam Pengecekan",
        HANDLING: "Sedang Ditangani",
        RESOLVED: "Sudah Ditangani"
    };

    return labels[status] || "";
}

function getComplaintCooldownUntil(transaction) {
    const value =
        transaction?.complaintResolvedAt ||
        transaction?.complaintStatusUpdatedAt;

    const time =
        Date.parse(value || "");

    if (!Number.isFinite(time)) {
        return null;
    }

    return time + 24 * 60 * 60 * 1000;
}

function complaintIsLocked(transaction) {
    const status =
        getComplaintStatus(transaction);

    if (
        status === "OPEN" ||
        status === "CHECKING" ||
        status === "HANDLING"
    ) {
        return true;
    }

    if (status === "RESOLVED") {
        const until =
            getComplaintCooldownUntil(
                transaction
            );

        return (
            until === null ||
            Date.now() < until
        );
    }

    return false;
}

function renderComplaintProgress(transaction) {
    const status =
        getComplaintStatus(transaction);

    if (!status || status === "NONE") {
        return "";
    }

    let description = "";

    if (status === "OPEN") {
        description =
            "Laporanmu sudah terkirim dan menunggu pemeriksaan admin.";
    } else if (status === "CHECKING") {
        description =
            "Admin sedang memeriksa transaksi dan laporanmu.";
    } else if (status === "HANDLING") {
        description =
            "Laporanmu sedang ditangani oleh admin.";
    } else if (status === "RESOLVED") {
        const until =
            getComplaintCooldownUntil(
                transaction
            );

        if (
            until &&
            Date.now() < until
        ) {
            description =
                "Laporan sudah ditangani. Laporan ulang tersedia setelah " +
                new Date(until).toLocaleString(
                    "id-ID",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                ) +
                ".";
        } else {
            description =
                "Laporan sudah ditangani. Jika masalah masih terjadi, kamu dapat membuat laporan ulang.";
        }
    }

    return `
        <div class="complaint-progress ${status.toLowerCase()}">
            <strong>
                ${escapeHtml(
                    getComplaintLabel(status)
                )}${status === "RESOLVED" ? " ✓" : ""}
            </strong>
            <span>
                ${escapeHtml(description)}
            </span>
        </div>
    `;
}

function renderTransaction(transaction) {

    const date = transaction.createdAt
        ? new Date(transaction.createdAt).toLocaleString(
            "id-ID",
            {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        )
        : "-";

    const price =
        Number(transaction.price || 0)
            .toLocaleString("id-ID");

    const status =
        getTransactionStatusLabel(
            transaction
        );

    return `
        <article class="transaction-card">

            <div class="transaction-top">

                <div>
                    <div class="product-name">
                        ${escapeHtml(transaction.productName)}
                    </div>

                    <div class="target">
                        ${escapeHtml(transaction.target)}
                    </div>
                </div>

                <div class="price">
                    Rp ${price}
                </div>

            </div>


            <div class="transaction-code-box">
                <div class="transaction-code-content">
                    <span class="transaction-code-label">
                        Kode Transaksi
                    </span>

                    <span class="transaction-code-value">
                        ${escapeHtml(
                            transaction.transactionId
                        )}
                    </span>
                </div>

                <button
                    type="button"
                    class="transaction-copy-button"
                    onclick='copyTransactionCode(
                        ${JSON.stringify(
                            String(
                                transaction.transactionId || ""
                            )
                        )},
                        this
                    )'
                >
                    Salin
                </button>
            </div>

            ${
                (
                    transactionCanBeReceived(
                        transaction
                    ) ||
                    transactionCanBeReported(
                        transaction
                    ) ||
                    (
                        getComplaintStatus(
                            transaction
                        ) &&
                        getComplaintStatus(
                            transaction
                        ) !== "NONE"
                    )
                )
                    ? `
                        <div class="transaction-feedback-actions">

                            ${
                                transactionCanBeReceived(
                                    transaction
                                )
                                    ? `
                                        <button
                                            type="button"
                                            class="transaction-feedback-button received"
                                            onclick='markTransactionReceived(
                                                ${JSON.stringify(
                                                    String(
                                                        transaction.transactionId || ""
                                                    )
                                                )},
                                                this
                                            )'
                                        >
                                            ✓ Sudah Diterima
                                        </button>
                                    `
                                    : ""
                            }

                            ${
                                complaintIsLocked(
                                    transaction
                                )
                                    ? `
                                        <button
                                            type="button"
                                            class="transaction-feedback-button not-received complaint-locked"
                                            disabled
                                        >
                                            ${
                                                getComplaintStatus(
                                                    transaction
                                                ) === "OPEN"
                                                    ? "Laporan Terkirim ✓"
                                                    : getComplaintStatus(
                                                        transaction
                                                    ) === "CHECKING"
                                                        ? "Dalam Pengecekan"
                                                        : getComplaintStatus(
                                                            transaction
                                                        ) === "HANDLING"
                                                            ? "Sedang Ditangani"
                                                            : "Sudah Ditangani ✓"
                                            }
                                        </button>
                                    `
                                    : (
                                        transactionCanBeReported(
                                            transaction
                                        )
                                            ? `
                                                <button
                                                    type="button"
                                                    class="transaction-feedback-button not-received"
                                                    onclick='markTransactionNotReceived(
                                                        ${JSON.stringify(
                                                            String(
                                                                transaction.transactionId || ""
                                                            )
                                                        )},
                                                        this
                                                    )'
                                                >
                                                    ! Belum Diterima
                                                </button>
                                            `
                                            : ""
                                    )
                            }

                        </div>
                    `
                    : ""
            }

            ${renderComplaintProgress(transaction)}

            <div class="meta">

                <span class="transaction-type">
                    ${escapeHtml(
                        getHistoryTypeLabel(
                            normalizeHistoryType(
                                transaction
                            )
                        )
                    )}
                </span>

                <span class="status">
                    ${escapeHtml(status)}
                </span>

                <span>
                    ${escapeHtml(date)}
                </span>

                <span>
                    ${escapeHtml(transaction.transactionId)}
                </span>

            </div>

        </article>
    `;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

setupFeedbackUI();
setupHistoryTabs();
loadHistory();
</script>



<div
    id="feedbackModal"

>
    <div

<script id="bayora-rating-click-fix">
(function () {

    function selectFeedbackRating(star) {
        if (!star) return;

        const value =
            Number(star.dataset.rating);

        if (
            !Number.isInteger(value) ||
            value < 1 ||
            value > 5
        ) {
            return;
        }

        feedbackRating = value;

        if (
            typeof updateFeedbackStars ===
            "function"
        ) {
            updateFeedbackStars();
        }

        const message =
            document.getElementById(
                "feedbackMessage"
            );

        if (message) {
            message.textContent = "";
        }
    }

    document.addEventListener(
        "click",
        function (event) {

            const star =
                event.target.closest(
                    ".feedback-star"
                );

            if (!star) return;

            event.preventDefault();
            event.stopPropagation();

            selectFeedbackRating(star);
        }
    );

    document.addEventListener(
        "touchend",
        function (event) {

            const star =
                event.target.closest(
                    ".feedback-star"
                );

            if (!star) return;

            selectFeedbackRating(star);
        },
        {
            passive: true
        }
    );

})();
</script>
