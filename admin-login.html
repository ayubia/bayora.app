<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin — BAYORA</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    background: #f7f9fc;
    color: #142b52;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.admin-login-page {
    width: 100%;
    max-width: 430px;
}

.login-card {
    background: #ffffff;
    border: 1px solid #e7edf5;
    border-radius: 22px;
    padding: 34px;

    box-shadow:
        0 20px 55px rgba(20,43,82,.10);
}

/* =========================
   BAYORA BRAND
========================= */

.bayora-brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-bottom: 38px;

    text-decoration: none;
}

.bayora-logo-image {
    display: block;

    width: 48px;
    height: 48px;

    min-width: 48px;
    min-height: 48px;

    max-width: 48px;
    max-height: 48px;

    object-fit: contain;
}

.bayora-logo-text {
    display: inline-block;

    color: #1264d8 !important;
    -webkit-text-fill-color: #1264d8 !important;

    font-size: 20px;
    font-weight: 800;
    line-height: 1;

    white-space: nowrap;
}

/* =========================
   TITLE
========================= */

.eyebrow {
    margin: 0 0 8px;

    color: #2478e8;

    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
}

h1 {
    margin: 0 0 30px;

    color: #142b52;

    font-size: 32px;
    line-height: 1.15;
}

/* =========================
   FORM
========================= */

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #52627a;

    font-size: 13px;
    font-weight: 600;
}

.field input {
    width: 100%;

    padding: 14px 15px;

    border: 1px solid #dce3ed;
    border-radius: 12px;

    outline: none;

    background: #ffffff;
    color: #142b52;

    font-family: inherit;
    font-size: 15px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.field input:focus {
    border-color: #2478e8;

    box-shadow:
        0 0 0 3px rgba(36,120,232,.10);
}

/* =========================
   BUTTON
========================= */

button {
    width: 100%;

    margin-top: 8px;
    padding: 14px 16px;

    border: 0;
    border-radius: 12px;

    background: #1264d8;
    color: #ffffff;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .1s ease;
}

button:hover {
    background: #0f56ba;
}

button:active {
    transform: translateY(1px);
}

button:disabled {
    opacity: .65;
    cursor: wait;
}

/* =========================
   ERROR
========================= */

.error {
    display: none;

    margin-top: 15px;
    padding: 11px 13px;

    border-radius: 10px;

    background: #fff1f1;
    color: #c62828;

    font-size: 13px;
    line-height: 1.4;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        padding: 16px;
    }

    .login-card {
        padding: 26px 22px;
        border-radius: 18px;
    }

    .bayora-brand {
        margin-bottom: 32px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
    <link rel="icon" href="/favicon.ico?v=bayora" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=bayora">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bayora">
</head>

<body>

<main class="admin-login-page">

    <section class="login-card">

        <a href="/" class="bayora-brand">
            <img
                src="/logo-bayora.png"
                class="bayora-logo-image"
                alt="Bayora"
            >

            <span class="bayora-logo-text">
                BAYORA
            </span>
        </a>

        <p class="eyebrow">
            ADMIN
        </p>

        <h1>
            Masuk ke Dashboard
        </h1>

        <form id="loginForm">

            <div class="field">
                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                Masuk ke Dashboard
            </button>

            <div id="error" class="error"></div>

        </form>

    </section>

</main>

<script>
document
    .getElementById("loginForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const button =
            document.getElementById("loginButton");

        const error =
            document.getElementById("error");

        error.style.display = "none";
        error.textContent = "";

        button.disabled = true;
        button.textContent = "Memproses...";

        try {

            const response = await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {

                error.textContent =
                    data.error ||
                    "Username atau password salah.";

                error.style.display = "block";

                button.disabled = false;
                button.textContent =
                    "Masuk ke Dashboard";

                return;
            }

            window.location.href =
                "/admin.html";

        } catch (err) {

            error.textContent =
                "Tidak dapat terhubung ke server.";

            error.style.display = "block";

            button.disabled = false;
            button.textContent =
                "Masuk ke Dashboard";
        }

    });
</script>

</body>
</html>
